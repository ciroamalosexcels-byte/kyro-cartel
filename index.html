<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kyro · mandá un mensaje al cartel</title>
<meta name="description" content="Escribí un mensaje y aparece en el cartel LED de Kyro.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Saira+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Igual que la página del pez: negro, bordes azul LED con brillo. Sin emojis: los íconos son
     los mismos dibujos de LEDs que salen en el cartel. */
  :root { --casco:#03040c; --apagado:#0a1240; --led:#0026ff; --brillo:#4d6bff; --texto:#d5ddff; --tenue:#7f8fd8; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:#000; color:var(--texto); }
  body { font:500 17px/1.45 "Saira Semi Condensed", "Arial Narrow", sans-serif; font-variant-emoji:text; min-height:100vh; }
  main { width:100%; max-width:560px; margin:0 auto; padding:24px 16px 40px; display:grid; gap:18px; }
  .brilla, h1, h2 { color:var(--brillo); text-shadow:0 0 6px var(--led), 0 0 14px var(--led); }
  h1 { margin:0; font:400 30px/1 "Bungee", sans-serif; text-align:center; }
  .sub { text-align:center; color:var(--tenue); margin-top:-10px; }
  .visor { padding:8px; background:#000; border:3px solid var(--led); box-shadow:0 0 0 3px #000, 0 0 0 5px var(--apagado), 0 0 24px #0026ff44; }
  canvas { width:100%; height:auto; display:block; }
  .modulo { padding:16px; background:var(--casco); border:3px solid var(--led); display:grid; gap:12px;
            box-shadow:0 0 0 3px #000, 0 0 0 5px var(--apagado), 0 0 20px #0026ff2e; }
  h2 { margin:0; font:400 19px/1.1 "Bungee", sans-serif; }
  .ayuda { color:var(--tenue); margin:-6px 0 0; }
  textarea { width:100%; min-height:96px; resize:vertical; background:#000; color:var(--texto); border:2px solid var(--apagado);
             padding:12px 14px; font:inherit; font-size:20px; font-variant-emoji:text; }
  textarea:focus { outline:none; border-color:var(--led); box-shadow:0 0 12px #0026ff66; }
  .fila { display:flex; gap:6px; flex-wrap:wrap; }
  .ico { background:#000; border:2px solid var(--led); padding:6px; width:44px; height:40px; cursor:pointer; color:var(--brillo);
         display:grid; place-items:center; }
  .ico svg { width:22px; height:22px; shape-rendering:crispEdges; filter:drop-shadow(0 0 3px var(--led)); }
  .ico:active { background:var(--brillo); color:#000; }
  .chip { background:#000; color:var(--brillo); border:2px solid var(--led); padding:7px 12px; font:inherit; font-size:15px; font-weight:600; cursor:pointer; }
  .chip.on { background:var(--brillo); color:#000; box-shadow:0 0 14px #0026ff88; }
  .pie { display:flex; justify-content:space-between; align-items:center; color:var(--tenue); font-size:15px; }
  .enviar { width:100%; padding:16px; background:var(--brillo); color:#000; border:0; font:400 18px/1 "Bungee", sans-serif;
            cursor:pointer; box-shadow:0 0 18px #0026ff88; }
  .enviar:disabled { opacity:.45; cursor:default; }
  #estado { text-align:center; min-height:1.4em; color:var(--brillo); }
  .pez { display:flex; align-items:center; justify-content:center; gap:12px; padding:14px; color:var(--brillo); text-decoration:none;
         border:2px solid var(--led); background:#000; font-weight:600; }
  .pez svg { width:34px; height:22px; shape-rendering:crispEdges; filter:drop-shadow(0 0 3px var(--led)); }
  :focus-visible { outline:2px solid var(--brillo); outline-offset:2px; }
</style>
</head>
<body>
<main>
  <h1>Kyro</h1>
  <div class="sub">Lo que escribas aparece en el cartel</div>
  <div class="visor"><canvas id="led" width="672" height="112" aria-label="Vista previa del cartel"></canvas></div>

  <section class="modulo">
    <h2>Tu mensaje</h2>
    <p class="ayuda">Si lo dejás vacío, se manda solo la animación.</p>
    <textarea id="msg" maxlength="120" placeholder="Hola Kyro"></textarea>
    <div class="fila" id="iconos" aria-label="Agregar un ícono"></div>
    <div class="pie"><span>Aparece en el cartel en segundos</span><span id="cuenta">0 / 120</span></div>
  </section>

  <section class="modulo">
    <h2>Animación al terminar</h2>
    <div class="fila" id="anims"></div>
  </section>

  <button class="enviar" id="enviar">Mandar al cartel</button>
  <div id="estado" role="status"></div>
  <a class="pez" href="tamagotchi/"><svg id="svgPez" viewBox="0 0 10 6" fill="currentColor" aria-hidden="true"></svg>Jugar con el Tamagotchi del cartel</a>
</main>

<script>
const CANAL = "https://ntfy.sh/kyro-cartel-2e797e508e";
// Los mismos dibujos de LEDs que usa el cartel para cada ícono (fuente.ICONOS)
const ICONOS = [["♪", "Nota", ["0001100", "0001110", "0001011", "0001001", "0111000", "1111000", "0110000"]], ["♥", "Corazón", ["0110110", "1111111", "1111111", "1111111", "0111110", "0011100", "0001000"]], ["★", "Estrella", ["0001000", "0001000", "1111111", "0111110", "0011100", "0110110", "1100011"]], ["☺", "Carita", ["0111110", "1000001", "1010101", "1000001", "1011101", "1000001", "0111110"]], ["☠", "Calavera", ["0111110", "1111111", "1001001", "1111111", "0110110", "0111110", "0101010"]], ["⚡", "Rayo", ["0001110", "0011100", "0111000", "1111111", "0001110", "0011100", "0011000"]], ["☀", "Sol", ["1001001", "0101010", "0011100", "1111111", "0011100", "0101010", "1001001"]], ["☾", "Luna", ["0011100", "0110000", "1100000", "1100000", "1100000", "0110000", "0011100"]], ["♦", "Diamante", ["0001000", "0011100", "0111110", "1111111", "0111110", "0011100", "0001000"]], ["✓", "OK", ["0000001", "0000011", "0000110", "1001100", "1111000", "0110000", "0000000"]], ["→", "Flecha", ["0001000", "0001100", "1111110", "1111111", "1111110", "0001100", "0001000"]], ["🔥", "Fuego", ["0001000", "0011000", "0011100", "0111110", "1110111", "1100011", "0111110"]], ["🍺", "Birra", ["0111100", "1111110", "1000011", "1000101", "1000101", "1000011", "1111110"]], ["☕", "Café", ["0100100", "0010010", "0000000", "1111110", "1111101", "1111110", "0111100"]], ["♣", "Trébol", ["0011100", "0011100", "1101011", "1111111", "1101011", "0001000", "0011100"]], ["⌂", "Casa", ["0001000", "0011100", "0111110", "1111111", "0100010", "0101010", "0101010"]]];
const ANIMS = [["corazon", "Corazón"], ["estrellas", "Estrellas"], ["ecualizador", "Ecualizador"], ["fuegos", "Fuegos artificiales"],
  ["carita", "Carita"], ["lluvia", "Lluvia de corazones"], ["pacman", "Pac-Man"], ["invasores", "Invasores"], ["onda", "Onda"],
  ["monitor", "Monitor cardíaco"], ["pez", "Pez"], ["escarabajo", "Escarabajo pelotero"], ["dragon", "Dragón"], ["burbujas", "Burbujas"],
  ["ninguna", "Ninguna"]];
let anim = "corazon";
const $ = s => document.querySelector(s);
const msg = $("#msg");

function svgDe(filas) {
  let r = "";
  filas.forEach((f, y) => [...f].forEach((b, x) => { if (b === "1") r += `<rect x="${x}" y="${y}" width="1.02" height="1.02"/>`; }));
  return `<svg viewBox="0 0 ${filas[0].length} ${filas.length}" fill="currentColor" aria-hidden="true">${r}</svg>`;
}
$("#svgPez").outerHTML = svgDe(["0000011100", "1000111110", "1101111101", "1111111111", "1101111110", "1000011100"]);

$("#iconos").innerHTML = ICONOS.map(([c, n, f]) => `<button class="ico" type="button" data-c="${c}" title="${n}" aria-label="${n}">${svgDe(f)}</button>`).join("");
$("#iconos").onclick = e => {
  const b = e.target.closest(".ico"); if (!b) return;
  const a = msg.selectionStart, z = msg.selectionEnd, c = b.dataset.c;
  msg.value = (msg.value.slice(0, a) + c + msg.value.slice(z)).slice(0, 120);
  msg.focus(); msg.selectionStart = msg.selectionEnd = a + c.length; actualizar();
};

$("#anims").innerHTML = ANIMS.map(([id, n]) => `<button type="button" class="chip${id === anim ? " on" : ""}" data-id="${id}">${n}</button>`).join("");
$("#anims").onclick = e => {
  const b = e.target.closest(".chip"); if (!b) return;
  anim = b.dataset.id;
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === b));
  actualizar();
};

function actualizar() {
  $("#cuenta").textContent = `${[...msg.value].length} / 120`;
  const vacio = !msg.value.trim();
  $("#enviar").textContent = vacio ? "Mandar solo la animación" : "Mandar al cartel";
  $("#enviar").disabled = vacio && anim === "ninguna";
}
msg.oninput = actualizar;
actualizar();

$("#enviar").onclick = async () => {
  const texto = msg.value.trim();
  if (!texto && anim === "ninguna") { msg.focus(); return; }
  $("#enviar").disabled = true; $("#estado").textContent = "Mandando…";
  try {
    const url = texto ? `${CANAL}?title=${anim}` : `${CANAL}?title=${anim}&tags=solo-animacion`;
    const r = await fetch(url, { method: "POST", body: texto || "animación" });
    if (!r.ok) throw new Error(r.status);
    $("#estado").textContent = "Mandado: mirá el cartel";
    msg.value = ""; actualizar();
  } catch {
    $("#estado").textContent = "No se pudo mandar. Revisá la conexión y probá de nuevo.";
  } finally {
    setTimeout(actualizar, 1500);
  }
};

// Vista previa: el texto corre como en el cartel, con los íconos dibujados igual que en los LEDs.
const ctx = $("#led").getContext("2d"), W = 96, H = 16, D = 7;
const off = document.createElement("canvas"), octx = off.getContext("2d");
const MAPA = Object.fromEntries(ICONOS.map(([c, , f]) => [c, f]));
let x = W;
function frame() {
  const partes = [...(msg.value.trim() || "Escribí tu mensaje").toUpperCase()];
  octx.font = "bold 14px monospace";
  const ancho = partes.reduce((a, c) => a + (MAPA[c] ? 16 : octx.measureText(c).width), 0);
  off.width = Math.ceil(ancho) + 4; off.height = H;
  octx.font = "bold 14px monospace"; octx.fillStyle = "#fff"; octx.textBaseline = "middle";
  let cx = 0;
  for (const c of partes) {
    if (MAPA[c]) {
      MAPA[c].forEach((f, yy) => [...f].forEach((b, xx) => { if (b === "1") octx.fillRect(cx + xx * 2, 1 + yy * 2, 2, 2); }));
      cx += 16;
    } else { octx.fillText(c, cx, H / 2 + 1); cx += octx.measureText(c).width; }
  }
  const px = octx.getImageData(0, 0, off.width, H).data;
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W * D, H * D);
  for (let yy = 0; yy < H; yy++) for (let xx = 0; xx < W; xx++) {
    const sx = Math.floor(xx - x), on = sx >= 0 && sx < off.width && px[(yy * off.width + sx) * 4 + 3] > 120;
    ctx.fillStyle = on ? "#3d5cff" : "#080f38";
    ctx.shadowBlur = on ? D : 0; ctx.shadowColor = "#0026ff";
    ctx.beginPath(); ctx.arc(xx * D + D / 2, yy * D + D / 2, D * .38, 0, 7); ctx.fill();
  }
  ctx.shadowBlur = 0;
  x -= 0.6; if (x < -off.width) x = W;
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
