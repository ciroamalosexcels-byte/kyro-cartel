<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KYRO CARTEL</title>
<meta name="description" content="Escribí un mensaje y aparece en el cartel LED de Kyro.">
<meta name="theme-color" content="#0b0b0d">
<style>
  :root { --bg:#0b0b0d; --panel:#16161a; --line:#2a2a31; --txt:#ececf0; --dim:#8b8b96; --led:#2f8cff; --ledoff:#0b1a2e; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--txt); }
  body { font:600 15px/1.45 system-ui, -apple-system, sans-serif; text-transform:uppercase; letter-spacing:.04em; min-height:100vh; display:flex; }
  main { width:100%; max-width:560px; margin:auto; padding:32px 16px; display:grid; gap:20px; }
  h1 { margin:0; font-size:15px; letter-spacing:.3em; color:var(--dim); text-align:center; }
  canvas { width:100%; height:auto; display:block; background:#050505; border-radius:10px; border:1px solid var(--line); image-rendering:pixelated; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; display:grid; gap:12px; }
  label { color:var(--dim); font-size:11px; letter-spacing:.15em; }
  textarea { width:100%; min-height:96px; resize:vertical; background:#0a0a0c; color:var(--txt); border:1px solid var(--line); border-radius:10px; padding:12px 14px; font:inherit; font-size:18px; text-transform:uppercase; letter-spacing:.05em; }
  textarea:focus { outline:2px solid var(--led); outline-offset:1px; }
  .row { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { background:#222228; color:var(--txt); border:1px solid var(--line); border-radius:999px; padding:8px 12px; font:inherit; font-size:13px; cursor:pointer; }
  .chip.on { background:var(--led); border-color:var(--led); color:#fff; }
  .ico { background:#222228; color:var(--txt); border:1px solid var(--line); border-radius:8px; font-size:18px; padding:6px 10px; min-width:42px; cursor:pointer; }
  .foot { display:flex; justify-content:space-between; align-items:center; color:var(--dim); font-size:12px; }
  button.send { width:100%; padding:16px; background:var(--led); color:#fff; border:0; border-radius:12px; font:inherit; font-size:17px; letter-spacing:.12em; cursor:pointer; }
  button.send:disabled { opacity:.5; cursor:default; }
  #estado { text-align:center; min-height:1.4em; color:var(--dim); }
  #estado.ok { color:#3ddc84; }
  #estado.err { color:var(--led); }
</style>
</head>
<body>
<main>
  <h1>● KYRO CARTEL</h1>
  <canvas id="led" width="672" height="112" aria-label="Vista previa del cartel"></canvas>

  <div class="card">
    <label for="msg">ESCRIBÍ TU MENSAJE (O DEJALO VACÍO PARA MANDAR SOLO LA ANIMACIÓN)</label>
    <textarea id="msg" maxlength="120" placeholder="HOLA KYRO ♥"></textarea>
    <div class="row" id="iconos"></div>
    <div class="foot"><span>APARECE EN EL CARTEL EN SEGUNDOS</span><span id="cuenta">0 / 120</span></div>
  </div>

  <div class="card">
    <label>ANIMACIÓN AL TERMINAR EL MENSAJE</label>
    <div class="row" id="anims"></div>
  </div>

  <button class="send" id="enviar">ENVIAR AL CARTEL</button>
  <div id="estado" role="status"></div>
</main>

<script>
const CANAL = "https://ntfy.sh/kyro-cartel-2e797e508e";
const ICONOS = "♪♥★☺☠⚡☀☾♦✓→🔥🍺☕♣⌂".match(/./gu);
const ANIMS = [["corazon", "♥ CORAZÓN"], ["estrellas", "✦ ESTRELLAS"], ["ecualizador", "▮▮ ECUALIZADOR"],
  ["fuegos", "✺ FUEGOS ARTIFICIALES"], ["carita", "☺ CARITA"], ["lluvia", "♥♥ LLUVIA DE CORAZONES"],
  ["pacman", "ᗧ PAC-MAN"], ["invasores", "👾 INVASORES"], ["onda", "∿ ONDA"], ["monitor", "♡ MONITOR CARDÍACO"], ["pez", "🐟 PEZ"], ["escarabajo", "🪲 ESCARABAJO PELOTERO"], ["dragon", "🐉 DRAGÓN"], ["burbujas", "○ BURBUJAS"], ["ninguna", "✕ NINGUNA"]];
let anim = "corazon";
const $ = s => document.querySelector(s);
const msg = $("#msg");

$("#iconos").innerHTML = ICONOS.map(c => `<button class="ico" type="button">${c}</button>`).join("");
$("#iconos").onclick = e => {
  if (!e.target.classList.contains("ico")) return;
  const a = msg.selectionStart, b = msg.selectionEnd, c = e.target.textContent;
  msg.value = (msg.value.slice(0, a) + c + msg.value.slice(b)).slice(0, 120);
  msg.focus(); msg.selectionStart = msg.selectionEnd = a + c.length; actualizar();
};

$("#anims").innerHTML = ANIMS.map(([id, n]) => `<button type="button" class="chip${id === anim ? " on" : ""}" data-id="${id}">${n}</button>`).join("");
$("#anims").onclick = e => {
  const b = e.target.closest(".chip"); if (!b) return;
  anim = b.dataset.id;
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === b));
  actualizar();
};

function actualizar() {
  $("#cuenta").textContent = `${[...msg.value].length} / 120`;
  const vacio = !msg.value.trim();
  $("#enviar").textContent = vacio ? "ENVIAR SOLO LA ANIMACIÓN" : "ENVIAR AL CARTEL";
  $("#enviar").disabled = vacio && anim === "ninguna";
}
msg.oninput = actualizar;
actualizar();

$("#enviar").onclick = async () => {
  const texto = msg.value.trim();
  if (!texto && anim === "ninguna") { msg.focus(); return; }
  $("#enviar").disabled = true; $("#estado").className = ""; $("#estado").textContent = "ENVIANDO…";
  try {
    const url = texto ? `${CANAL}?title=${anim}` : `${CANAL}?title=${anim}&tags=solo-animacion`;
    const r = await fetch(url, { method: "POST", body: texto || "animación" });
    if (!r.ok) throw new Error(r.status);
    $("#estado").className = "ok"; $("#estado").textContent = "¡ENVIADO! MIRÁ EL CARTEL";
    msg.value = ""; actualizar();
  } catch {
    $("#estado").className = "err"; $("#estado").textContent = "NO SE PUDO ENVIAR, PROBÁ DE NUEVO";
  } finally {
    setTimeout(actualizar, 1500);
  }
};

// Vista previa decorativa: el texto corre como en el cartel.
const ctx = $("#led").getContext("2d"), W = 96, H = 16, D = 7;
const off = document.createElement("canvas"), octx = off.getContext("2d");
let x = W;
function frame() {
  const t = (msg.value.trim() || "ESCRIBÍ TU MENSAJE").toUpperCase();
  octx.font = "bold 14px monospace";
  off.width = Math.ceil(octx.measureText(t).width) + 4; off.height = H;
  octx.font = "bold 14px monospace"; octx.fillStyle = "#fff"; octx.textBaseline = "middle";
  octx.fillText(t, 0, H / 2 + 1);
  const px = octx.getImageData(0, 0, off.width, H).data;
  ctx.fillStyle = "#050505"; ctx.fillRect(0, 0, W * D, H * D);
  for (let yy = 0; yy < H; yy++) for (let xx = 0; xx < W; xx++) {
    const sx = Math.floor(xx - x), on = sx >= 0 && sx < off.width && px[(yy * off.width + sx) * 4 + 3] > 120;
    ctx.fillStyle = on ? "#3d9bff" : "#0b1a2e";
    ctx.beginPath(); ctx.arc(xx * D + D / 2, yy * D + D / 2, D * .38, 0, 7); ctx.fill();
  }
  x -= 0.6; if (x < -off.width) x = W;
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
