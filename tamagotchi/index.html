<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KYRO TAMAGOTCHI</title>
<meta name="description" content="Cuidá al pez del cartel LED de Kyro: dale de comer, limpiale la pecera y decorala.">
<meta name="theme-color" content="#0b0b0d">
<style>
  :root { --bg:#0b0b0d; --egg:#1b2a44; --egg2:#11192b; --line:#2a3550; --txt:#ececf0; --dim:#8b93a6; --led:#3d9bff; --ok:#3ddc84; --warn:#ffb020; --bad:#ff4d4d; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--txt); }
  body { font:700 14px/1.4 system-ui, -apple-system, sans-serif; text-transform:uppercase; letter-spacing:.05em; min-height:100vh; display:flex; justify-content:center; }
  main { width:100%; max-width:440px; padding:20px 16px 40px; display:grid; gap:18px; }
  .huevo { background:radial-gradient(120% 90% at 30% 20%, var(--egg), var(--egg2)); border:2px solid var(--line); border-radius:50% 50% 46% 46% / 58% 58% 42% 42%; padding:38px 26px 30px; display:grid; gap:14px; box-shadow:0 20px 60px #0008, inset 0 2px 0 #ffffff14; }
  .marca { text-align:center; font-size:12px; letter-spacing:.35em; color:var(--dim); }
  .pantalla { position:relative; display:grid; place-items:center; padding:14px; background:#050505; border:3px solid #06223f; border-radius:14px; box-shadow:inset 0 0 30px #000; }
  #leds { display:block; image-rendering:pixelated; }
  #espera { position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:20px; font-size:11px; color:var(--dim); background:#050505cc; border-radius:11px; }
  #espera[hidden] { display:none; }
  #animo { text-align:center; font-size:12px; color:var(--dim); margin-bottom:-6px; }
  .barras { display:grid; gap:7px; }
  .barra { display:grid; grid-template-columns:96px 1fr 34px; align-items:center; gap:8px; font-size:11px; color:var(--dim); }
  .barra .riel { height:10px; background:#0006; border-radius:6px; overflow:hidden; }
  .barra .nivel { height:100%; border-radius:6px; transition:width .6s, background .6s; }
  .barra b { text-align:right; color:var(--txt); }
  .botones { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
  .deco { display:grid; grid-template-columns:repeat(5, 1fr); gap:8px; }
  button { font:inherit; color:var(--txt); background:#ffffff10; border:1px solid #ffffff1c; border-radius:16px; padding:12px 6px; cursor:pointer; display:grid; gap:4px; justify-items:center; font-size:11px; }
  button span { font-size:26px; line-height:1; }
  .deco button span { font-size:22px; }
  button:active { transform:scale(.95); background:#3d9bff33; }
  button:disabled { opacity:.45; }
  .seccion { font-size:11px; color:var(--dim); letter-spacing:.2em; margin-bottom:-6px; }
  #aviso { text-align:center; min-height:1.4em; color:var(--dim); font-size:12px; }
  #aviso.ok { color:var(--ok); }
  #aviso.err { color:var(--bad); }
  .info { text-align:center; color:var(--dim); font-size:11px; }
  a { color:var(--led); }
</style>
</head>
<body>
<main>
  <div class="huevo">
    <div class="marca">● KYRO TAMAGOTCHI ●</div>
    <div id="animo">—</div>
    <div class="pantalla">
      <canvas id="leds"></canvas>
      <div id="espera">ESPERANDO AL CARTEL…</div>
    </div>
    <div class="barras">
      <div class="barra">PANCITA<div class="riel"><div class="nivel" id="bHambre"></div></div><b id="vHambre">–</b></div>
      <div class="barra">FELICIDAD<div class="riel"><div class="nivel" id="bFeliz"></div></div><b id="vFeliz">–</b></div>
      <div class="barra">LIMPIEZA<div class="riel"><div class="nivel" id="bLimpio"></div></div><b id="vLimpio">–</b></div>
    </div>
  </div>

  <div class="botones">
    <button data-accion="comer"><span>🍤</span>COMIDA</button>
    <button data-accion="limpiar"><span>🧽</span>LIMPIAR</button>
    <button data-accion="jugar"><span>🎾</span>JUGAR</button>
    <button data-accion="curar"><span>💊</span>CURAR</button>
    <button data-accion="luz"><span>💡</span>LUZ</button>
    <button data-accion="quitar"><span>↩️</span>QUITAR DECO</button>
  </div>

  <div class="seccion">DECORAR LA PECERA</div>
  <div class="deco">
    <button data-accion="planta"><span>🌿</span>PLANTA</button>
    <button data-accion="roca"><span>🪨</span>PIEDRA</button>
    <button data-accion="castillo"><span>🏰</span>CASTILLO</button>
    <button data-accion="concha"><span>🐚</span>CONCHA</button>
  </div>

  <div id="aviso" role="status"></div>
  <div class="info">LOS MISMOS LEDS QUE EL CARTEL · <a href="../">MANDAR UN MENSAJE</a></div>
</main>

<script>
const ACCIONES = "https://ntfy.sh/kyro-cartel-2e797e508e-tama";
const ESTADO = "https://ntfy.sh/kyro-cartel-2e797e508e-tama-estado";
const ANIMO = { feliz: "😊 FELIZ", hambre: "😋 TIENE HAMBRE", triste: "😢 TRISTE", enfermo: "🤒 ENFERMO", dormido: "💤 DURMIENDO" };
const $ = s => document.querySelector(s);
let estado = null;

function color(v) { return v > 60 ? "var(--ok)" : v > 30 ? "var(--warn)" : "var(--bad)"; }
function barra(id, v) {
  $("#b" + id).style.width = v + "%"; $("#b" + id).style.background = color(v); $("#v" + id).textContent = v;
}

function mostrar(e) {
  estado = e;
  barra("Hambre", 100 - e.hambre); barra("Feliz", e.felicidad); barra("Limpio", e.limpieza);
  $("#animo").textContent = ANIMO[e.humor] || e.humor;
}

// --- La pantalla: los mismos cuadros que pasa el cartel (los manda la PC) + la hora encima ---
const ON = "#3d9bff", OFF = "#0b1a2e";
const DIGITOS = {
  "0": ["111", "101", "101", "101", "111"], "1": ["010", "110", "010", "010", "111"],
  "2": ["111", "001", "111", "100", "111"], "3": ["111", "001", "111", "001", "111"],
  "4": ["101", "101", "111", "001", "001"], "5": ["111", "100", "111", "001", "111"],
  "6": ["111", "100", "111", "101", "111"], "7": ["111", "001", "010", "010", "010"],
  "8": ["111", "101", "111", "101", "111"], "9": ["111", "101", "111", "001", "111"],
};
const lienzo = $("#leds"), g = lienzo.getContext("2d");
let leds = null, cuadros = [], dot = 4, dibujado = "";

function medir(w, h) {
  const maxW = $(".pantalla").clientWidth - 34, maxH = Math.min(innerHeight * 0.62, 560);
  dot = Math.max(2, Math.floor(Math.min(maxW / w, maxH / h)));
  lienzo.width = w * dot; lienzo.height = h * dot;
  dibujado = "";
}

async function cargarLeds(meta, url) {
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error(r.status);
    const datos = new Uint8Array(await new Response(r.body.pipeThrough(new DecompressionStream("deflate"))).arrayBuffer());
    const tam = Math.ceil(meta.w / 8) * meta.h, lista = [];
    for (let k = 0; k < meta.n; k++) {                  // cada cuadro viene como XOR del anterior
      const c = datos.slice(k * tam, (k + 1) * tam);
      if (k) for (let j = 0; j < tam; j++) c[j] ^= lista[k - 1][j];
      lista.push(c);
    }
    if (!leds || leds.w !== meta.w || leds.h !== meta.h) medir(meta.w, meta.h);
    leds = meta; cuadros = lista; dibujado = "";
    $("#espera").hidden = true;
  } catch {
    if (!leds) { $("#espera").textContent = "EL CARTEL NO ESTÁ CONECTADO AHORA"; $("#espera").hidden = false; }
  }
}

function cuadroActual(ahora) {
  let inicio = leds.t0;
  if (leds.por_minuto) {                                // el acuario se recarga en cada cambio de minuto
    inicio = Math.floor(ahora / 60000) * 60000 + leds.desfase;
    if (inicio > ahora) inicio -= 60000;
    if (leds.t0 > inicio && leds.t0 <= ahora) inicio = leds.t0;
  }
  return Math.floor(Math.max(0, ahora - inicio) / leds.ms) % leds.n;
}

function pintar() {
  requestAnimationFrame(pintar);
  if (!leds || !cuadros.length) return;
  const ahora = Date.now(), i = cuadroActual(ahora), hora = new Date().toTimeString().slice(0, 5);
  const clave = i + hora;
  if (clave === dibujado) return;
  dibujado = clave;
  const { w, h } = leds, fila = Math.ceil(w / 8), c = cuadros[i];
  const px = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) px[y * w + x] = (c[y * fila + (x >> 3)] >> (7 - (x & 7))) & 1;
  const punto = (x, y, v) => { if (x >= 0 && x < w && y >= 0 && y < h) px[y * w + x] = v; };
  // la hora, igual que en el cartel: un renglón arriba con recuadro apagado y los dos puntos titilando
  const x0 = w >= h ? w - 16 : Math.floor((w - 15) / 2);
  for (let y = 0; y <= 5; y++) for (let x = x0 - 1; x <= x0 + 15; x++) punto(x, y, 0);
  [[hora[0], 0], [hora[1], 4], [hora[3], 8], [hora[4], 12]].forEach(([d, dx]) =>
    DIGITOS[d].forEach((f, y) => [...f].forEach((b, x) => b === "1" && punto(x0 + dx + x, y, 1))));
  if (Math.floor(i / leds.cps) % 2 === 0) { punto(x0 + 7, 1, 1); punto(x0 + 7, 3, 1); }
  g.fillStyle = "#050505"; g.fillRect(0, 0, lienzo.width, lienzo.height);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    g.fillStyle = px[y * w + x] ? ON : OFF;
    g.beginPath(); g.arc(x * dot + dot / 2, y * dot + dot / 2, dot * 0.38, 0, 7); g.fill();
  }
}
medir(16, 96);
g.fillStyle = "#050505"; g.fillRect(0, 0, lienzo.width, lienzo.height);
for (let y = 0; y < 96; y++) for (let x = 0; x < 16; x++) {
  g.fillStyle = OFF; g.beginPath(); g.arc(x * dot + dot / 2, y * dot + dot / 2, dot * 0.38, 0, 7); g.fill();
}
requestAnimationFrame(pintar);
addEventListener("resize", () => leds && medir(leds.w, leds.h));

// El estado lo manda la PC: el último que haya y después cada cambio, al instante.
function recibir(ev) {
  const datos = JSON.parse(ev.message);
  mostrar(datos.estado || datos);                      // (los mensajes viejos traían solo el estado)
  if (datos.leds && ev.attachment) cargarLeds(datos.leds, ev.attachment.url);
  else if (datos.estado && !datos.leds) {
    leds = null; $("#espera").textContent = "EL CARTEL ESTÁ MOSTRANDO OTRA COSA"; $("#espera").hidden = false;
  }
}
async function cargarUltimo() {
  try {
    const r = await fetch(`${ESTADO}/json?poll=1&since=12h`);
    const lineas = (await r.text()).trim().split("\n").filter(Boolean);
    const ultimo = lineas.map(l => JSON.parse(l)).filter(e => e.event === "message").pop();
    if (ultimo) recibir(ultimo);
  } catch {}
}
cargarUltimo();
const fuente = new EventSource(`${ESTADO}/sse`);
fuente.onmessage = ev => { try { recibir(JSON.parse(ev.data)); } catch {} };

const FRASES = { comer: "¡AHÍ VA LA COMIDA!", limpiar: "¡A LIMPIAR!", jugar: "¡A JUGAR!", curar: "¡REMEDIO EN CAMINO!",
  luz: "LUZ CAMBIADA", planta: "PLANTITA NUEVA", roca: "PIEDRA NUEVA", castillo: "CASTILLO NUEVO", concha: "CONCHA NUEVA", quitar: "DECORACIÓN QUITADA" };

document.querySelectorAll("[data-accion]").forEach(b => b.onclick = async () => {
  const accion = b.dataset.accion;
  document.querySelectorAll("[data-accion]").forEach(x => x.disabled = true);
  $("#aviso").className = ""; $("#aviso").textContent = "ENVIANDO…";
  try {
    const r = await fetch(ACCIONES, { method: "POST", body: accion });
    if (!r.ok) throw new Error(r.status);
    $("#aviso").className = "ok"; $("#aviso").textContent = FRASES[accion] + " · MIRÁ EL CARTEL";
    if (navigator.vibrate) navigator.vibrate(30);
  } catch {
    $("#aviso").className = "err"; $("#aviso").textContent = "NO SE PUDO ENVIAR, PROBÁ DE NUEVO";
  } finally {
    setTimeout(() => document.querySelectorAll("[data-accion]").forEach(x => x.disabled = false), 1200);
  }
});
</script>
</body>
</html>
