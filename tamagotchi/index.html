<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KYRO TAMAGOTCHI</title>
<meta name="description" content="Cuidá al pez del cartel LED de Kyro: dale de comer, limpiale la pecera y decorala.">
<meta name="theme-color" content="#0b0b0d">
<style>
  :root { --bg:#0b0b0d; --egg:#1b2a44; --egg2:#11192b; --line:#2a3550; --txt:#ececf0; --dim:#8b93a6; --led:#3d9bff; --ok:#3ddc84; --warn:#ffb020; --bad:#ff4d4d; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--txt); }
  body { font:700 14px/1.4 system-ui, -apple-system, sans-serif; text-transform:uppercase; letter-spacing:.05em; min-height:100vh; display:flex; justify-content:center; }
  main { width:100%; max-width:440px; padding:20px 16px 40px; display:grid; gap:18px; }
  .huevo { background:radial-gradient(120% 90% at 30% 20%, var(--egg), var(--egg2)); border:2px solid var(--line); border-radius:50% 50% 46% 46% / 58% 58% 42% 42%; padding:38px 26px 30px; display:grid; gap:14px; box-shadow:0 20px 60px #0008, inset 0 2px 0 #ffffff14; }
  .marca { text-align:center; font-size:12px; letter-spacing:.35em; color:var(--dim); }
  .pantalla { position:relative; height:150px; background:#031326; border:3px solid #06223f; border-radius:14px; overflow:hidden; box-shadow:inset 0 0 30px #000; }
  .pantalla.noche { background:#01060d; }
  .agua { position:absolute; inset:0; background:repeating-linear-gradient(0deg, #3d9bff08 0 2px, transparent 2px 5px); }
  #pez { position:absolute; font-size:34px; transition:left 2.2s ease-in-out, top 2.2s ease-in-out; filter:drop-shadow(0 0 6px #3d9bff88); }
  #pez.izq { transform:scaleX(-1); }
  #pez.duerme { filter:grayscale(.6) brightness(.6); }
  #fondo { position:absolute; left:0; right:0; bottom:4px; display:flex; justify-content:space-around; align-items:flex-end; font-size:24px; padding:0 8px; }
  #cacas { position:absolute; left:10px; bottom:2px; font-size:16px; letter-spacing:6px; }
  #globo { position:absolute; font-size:20px; }
  #reloj { position:absolute; top:6px; right:10px; font:700 14px ui-monospace, monospace; color:var(--led); }
  #animo { position:absolute; top:6px; left:10px; font-size:12px; color:var(--dim); }
  .barras { display:grid; gap:7px; }
  .barra { display:grid; grid-template-columns:96px 1fr 34px; align-items:center; gap:8px; font-size:11px; color:var(--dim); }
  .barra .riel { height:10px; background:#0006; border-radius:6px; overflow:hidden; }
  .barra .nivel { height:100%; border-radius:6px; transition:width .6s, background .6s; }
  .barra b { text-align:right; color:var(--txt); }
  .botones { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
  .deco { display:grid; grid-template-columns:repeat(5, 1fr); gap:8px; }
  button { font:inherit; color:var(--txt); background:#ffffff10; border:1px solid #ffffff1c; border-radius:16px; padding:12px 6px; cursor:pointer; display:grid; gap:4px; justify-items:center; font-size:11px; }
  button span { font-size:26px; line-height:1; }
  .deco button span { font-size:22px; }
  button:active { transform:scale(.95); background:#3d9bff33; }
  button:disabled { opacity:.45; }
  .seccion { font-size:11px; color:var(--dim); letter-spacing:.2em; margin-bottom:-6px; }
  #aviso { text-align:center; min-height:1.4em; color:var(--dim); font-size:12px; }
  #aviso.ok { color:var(--ok); }
  #aviso.err { color:var(--bad); }
  .info { text-align:center; color:var(--dim); font-size:11px; }
  a { color:var(--led); }
</style>
</head>
<body>
<main>
  <div class="huevo">
    <div class="marca">● KYRO TAMAGOTCHI ●</div>
    <div class="pantalla" id="pantalla">
      <div class="agua"></div>
      <div id="animo">—</div>
      <div id="reloj">--:--</div>
      <div id="fondo"></div>
      <div id="cacas"></div>
      <div id="pez">🐟</div>
      <div id="globo"></div>
    </div>
    <div class="barras">
      <div class="barra">PANCITA<div class="riel"><div class="nivel" id="bHambre"></div></div><b id="vHambre">–</b></div>
      <div class="barra">FELICIDAD<div class="riel"><div class="nivel" id="bFeliz"></div></div><b id="vFeliz">–</b></div>
      <div class="barra">LIMPIEZA<div class="riel"><div class="nivel" id="bLimpio"></div></div><b id="vLimpio">–</b></div>
    </div>
  </div>

  <div class="botones">
    <button data-accion="comer"><span>🍤</span>COMIDA</button>
    <button data-accion="limpiar"><span>🧽</span>LIMPIAR</button>
    <button data-accion="jugar"><span>🎾</span>JUGAR</button>
    <button data-accion="curar"><span>💊</span>CURAR</button>
    <button data-accion="luz"><span>💡</span>LUZ</button>
    <button data-accion="quitar"><span>↩️</span>QUITAR DECO</button>
  </div>

  <div class="seccion">DECORAR LA PECERA</div>
  <div class="deco">
    <button data-accion="planta"><span>🌿</span>PLANTA</button>
    <button data-accion="roca"><span>🪨</span>PIEDRA</button>
    <button data-accion="castillo"><span>🏰</span>CASTILLO</button>
    <button data-accion="concha"><span>🐚</span>CONCHA</button>
  </div>

  <div id="aviso" role="status"></div>
  <div class="info">LA PANTALLA DE VERDAD ES EL CARTEL LED · <a href="../">MANDAR UN MENSAJE</a></div>
</main>

<script>
const ACCIONES = "https://ntfy.sh/kyro-cartel-2e797e508e-tama";
const ESTADO = "https://ntfy.sh/kyro-cartel-2e797e508e-tama-estado";
const EMOJI_DECO = { planta: "🌿", roca: "🪨", castillo: "🏰", concha: "🐚" };
const ANIMO = { feliz: "😊 FELIZ", hambre: "😋 TIENE HAMBRE", triste: "😢 TRISTE", enfermo: "🤒 ENFERMO", dormido: "💤 DURMIENDO" };
const $ = s => document.querySelector(s);
let estado = null;

function color(v) { return v > 60 ? "var(--ok)" : v > 30 ? "var(--warn)" : "var(--bad)"; }
function barra(id, v) {
  $("#b" + id).style.width = v + "%"; $("#b" + id).style.background = color(v); $("#v" + id).textContent = v;
}

function mostrar(e) {
  estado = e;
  barra("Hambre", 100 - e.hambre); barra("Feliz", e.felicidad); barra("Limpio", e.limpieza);
  $("#animo").textContent = ANIMO[e.humor] || e.humor;
  $("#fondo").innerHTML = e.decoracion.map(d => `<span>${EMOJI_DECO[d] || ""}</span>`).join("");
  $("#cacas").textContent = "💩".repeat(e.caca);
  $("#pantalla").classList.toggle("noche", e.dormido);
  $("#pez").classList.toggle("duerme", e.dormido);
}

// El pez de la pantallita nada solo (el de verdad está en el cartel).
function nadar() {
  const p = $("#pantalla"), pez = $("#pez");
  const w = p.clientWidth - 46, h = p.clientHeight - 70;
  const quieto = estado && (estado.dormido || estado.humor === "enfermo");
  const x = quieto ? w / 2 : Math.random() * w;
  const y = quieto ? h + 18 : estado && estado.humor === "hambre" ? 22 : 24 + Math.random() * h;
  pez.classList.toggle("izq", x < parseFloat(pez.style.left || 0));
  pez.style.left = x + "px"; pez.style.top = y + "px";
  const globo = $("#globo");
  globo.textContent = !estado ? "" : estado.dormido ? "💤" : estado.humor === "hambre" ? "❗" :
    estado.humor === "enfermo" ? "🤒" : estado.humor === "feliz" && Math.random() < .4 ? "💙" : "";
  globo.style.left = (x + 28) + "px"; globo.style.top = Math.max(0, y - 14) + "px";
}
setInterval(nadar, 2300); nadar();

function reloj() { $("#reloj").textContent = new Date().toTimeString().slice(0, 5); }
setInterval(reloj, 1000); reloj();

// El estado lo manda la PC: el último que haya y después cada cambio, al instante.
async function cargarUltimo() {
  try {
    const r = await fetch(`${ESTADO}/json?poll=1&since=24h`);
    const lineas = (await r.text()).trim().split("\n").filter(Boolean);
    const ultimo = lineas.map(l => JSON.parse(l)).filter(e => e.event === "message").pop();
    if (ultimo) mostrar(JSON.parse(ultimo.message));
  } catch {}
}
cargarUltimo();
const fuente = new EventSource(`${ESTADO}/sse`);
fuente.onmessage = ev => { try { mostrar(JSON.parse(JSON.parse(ev.data).message)); } catch {} };

const FRASES = { comer: "¡AHÍ VA LA COMIDA!", limpiar: "¡A LIMPIAR!", jugar: "¡A JUGAR!", curar: "¡REMEDIO EN CAMINO!",
  luz: "LUZ CAMBIADA", planta: "PLANTITA NUEVA", roca: "PIEDRA NUEVA", castillo: "CASTILLO NUEVO", concha: "CONCHA NUEVA", quitar: "DECORACIÓN QUITADA" };

document.querySelectorAll("[data-accion]").forEach(b => b.onclick = async () => {
  const accion = b.dataset.accion;
  document.querySelectorAll("[data-accion]").forEach(x => x.disabled = true);
  $("#aviso").className = ""; $("#aviso").textContent = "ENVIANDO…";
  try {
    const r = await fetch(ACCIONES, { method: "POST", body: accion });
    if (!r.ok) throw new Error(r.status);
    $("#aviso").className = "ok"; $("#aviso").textContent = FRASES[accion] + " · MIRÁ EL CARTEL";
    if (navigator.vibrate) navigator.vibrate(30);
  } catch {
    $("#aviso").className = "err"; $("#aviso").textContent = "NO SE PUDO ENVIAR, PROBÁ DE NUEVO";
  } finally {
    setTimeout(() => document.querySelectorAll("[data-accion]").forEach(x => x.disabled = false), 1200);
  }
});
</script>
</body>
</html>
